@PART[CLEP_CEE2Lander]:NEEDS[RealFuels]:FINAL
{
    @mass = 0.95
    !RESOURCE,*{}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 2230.8
        basemass = -1
        type = ServiceModule
        TANK
        {
            name = ElectricCharge
            amount = full
            maxAmount = 12000
        }
        TANK
        {
            name = NTO
            amount = full
            maxAmount = 1113.1692
        }
        TANK
        {
            name = MMH
            amount = full
            maxAmount = 1117.6308
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS,*
        techLevel = 1
        origTechLevel = 1
        engineType = L
        origMass = 0.95
        configuration = MMH/NTO
        modded = false
        CONFIG
        {
            name = MMH/NTO
            thrusterPower = 0.15
            PROPELLANT
            {
                name = MMH
                ratio = 0.5010
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.4990
            }
            atmosphereCurve
            {
                key = 0 310
                key = 1 150
            }
        }
    }
}
