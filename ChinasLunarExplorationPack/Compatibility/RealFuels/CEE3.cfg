@PART[CLEP_CEE3entry]:NEEDS[RealFuels]:FINAL
{
    @mass = 0.15
    %maxTemp = 4600
    %skinMaxTemp = 6000
    %heatShieldDensity = 0.0125
    %heatShieldAblator = 30
    %skinThermalMassModifier = 1.5
    %skinMassPerArea = 5.0
    %skinInternalConductionMult = 0.25
    %emissiveConstant = 0.4

    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    %MODULE[ModuleAblator]
    {
        %ablativeResource = Ablator
        %outputResource = CharredAblator
        %outputMult = 0.8
        %lossExp = -25000
        %lossConst = 150
        %pyrolysisLossFactor = 145833
        %ablationTempThresh = 1250
        %reentryConductivity = 0.0025
        %infoTemp = 3000
    }
    @RESOURCE[Ablator]
    {
        @amount = 100
        @maxAmount = 100
    }

    MODULE
    {
        name = ModuleFuelTanks
        volume = 18
        basemass = -1
        type = ServiceModule
        TANK
        {
            name = ElectricCharge
            amount = full
            maxAmount = 5000
        }
        TANK
        {
            name = Hydrazine
            amount = Full
            maxAmount = 17.6
        }
    }
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    !MODULE[ModuleEngineConfigs],*{}
    !MODULE[ModuleAlternator],*{}
    !RESOURCE,*{}

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS
        configuration = Hydrazine
        origMass = 0.25
        modded = false
        CONFIG
        {
            name = Hydrazine
            thrusterPower = 0.02
            massMult = 1.00
            PROPELLANT
            {
                name = Hydrazine
                ratio = 0.5
                DrawGauge = true
            }
            atmosphereCurve
            {
                key = 0 265.0
                key = 1 130.0
            }
        }
    }
}
