@PART[CLEP_CEE3Orbiter]:NEEDS[RealFuels]:FINAL
{
    @mass = 1.069
    !RESOURCE,*{}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 3000
        basemass = -1
        type = ServiceModule
        TANK
        {
            name = ElectricCharge
            amount = full
            maxAmount = 15000
        }
        TANK
        {
            name = NTO
            amount = full
            maxAmount = 1,292.264025855639
        }
        TANK
        {
            name = MMH
            amount = full
            maxAmount = 1297.443440788929
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS,*
        techLevel = 1
        origTechLevel = 1
        engineType = L
        origMass = 1.069
        configuration = MMH/NTO
        modded = false
        CONFIG
        {
            name = MMH/NTO
            thrusterPower = 0.15
            PROPELLANT
            {
                name = MMH
                ratio = 0.5010
            }
            PROPELLANT
            {
                name = NTO
                ratio = 0.4990
            }
            atmosphereCurve
            {
                key = 0 310
                key = 1 150
            }
        }
    }
}
