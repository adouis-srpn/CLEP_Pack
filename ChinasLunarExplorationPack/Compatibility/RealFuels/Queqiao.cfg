@PART[CLEP_Queqiao1]:NEEDS[RealFuels]:FINAL
{
    @mass = 0.3137
    !RESOURCE,*{}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 105
        basemass = -1
        type = ServiceModule
        TANK
        {
            name = ElectricCharge
            amount = full
            maxAmount = 10000
        }
        TANK
        {
            name = Hydrazine
            amount = Full
            maxAmount = 104.5816733067729
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS
        configuration = Hydrazine
        origMass = 0.3137
        modded = false
        CONFIG
        {
            name = Hydrazine
            thrusterPower = 0.005
            massMult = 1.00
            PROPELLANT
            {
                name = Hydrazine
                ratio = 0.5
                DrawGauge = true
            }
            atmosphereCurve
            {
                key = 0 265.0
                key = 1 130.0
            }
        }
    }
}
