@PART[CLEP_CE7QR]:NEEDS[RealFuels]:FINAL
{
    @mass = 0.02
    @maxTemp = 2000

    !RESOURCE,*{}
    !MODULE[ModuleFuelTanks] {}
    MODULE
    {
        name = ModuleFuelTanks
        volume = 20
        basemass = -1
        type = ServiceModule
        TANK
        {
            name = ElectricCharge
            amount = full
            maxAmount = 1000
        }
        TANK
        {
            name = Hydrazine
            amount = Full
            maxAmount = 10.0
        }
    }
    @MODULE[ModuleEngines*]
    {
        @name = ModuleEnginesRF
    }

    !MODULE[ModuleEngineConfigs],*{}
    !MODULE[ModuleAlternator],*{}
    !RESOURCE,*{}

    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleEngines
        configuration = Booster_standard
        origMass = 0.02
        modded = false
        CONFIG
        {
            name = Booster_standard
            specLevel = operational
            minThrust = 0.1
            maxThrust = 0.1
            heatProduction = 100
            massMult = 1.00
            %ullage = False
            %pressureFed = True
            PROPELLANT
            {
                name = Hydrazine
                ratio = 0.1
                DrawGauge = True
            }
            atmosphereCurve
            {
                key = 0 380
                key = 1 255
            }
        }
    }
    MODULE
    {
        name = ModuleEngineConfigs
        type = ModuleRCS
        configuration = Hydrazine
        modded = false
        CONFIG
        {
            name = Hydrazine
            thrusterPower = 0.02
            PROPELLANT
            {
                name = Hydrazine
                ratio = 0.5
                DrawGauge = true
            }
            atmosphereCurve
            {
                key = 0 365.0
                key = 1 130.0
            }
        }
    }
}

