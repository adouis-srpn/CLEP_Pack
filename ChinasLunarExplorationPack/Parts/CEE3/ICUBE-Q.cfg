PART
{
	name = CLEP_ICUBE-Q
	module = Part
	author = SRP
	MODEL
	{
	model = ChinasLunarExplorationPack/Parts/CEE3/ICUBE-Q
	}
	rescaleFactor = 0.6
	node_stack_bottom = 0.0, -0.11499, 0.0, 0.0, -1.0, 0.0, 1
	TechRequired = advRocketry
	entryCost = 7000
	cost = 5000
	category = Pods
	subcategory = 0
	title  = #CLEP_ICUBEQ_title
	manufacturer = #CLEP_IIST
	description  = #CLEP_ICUBEQ_description
	attachRules = 1,0,1,1,0
	mass = 0.0065
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.3
	angularDrag = 2
	crashTolerance = 30
	breakingForce = 400
	breakingTorque = 400
	maxTemp = 2200
	bulkheadProfiles = size3, srf
	tags  = #CLEP_ICUBEQ_tags

	vesselType = Probe

	MODULE
	{
		name = ModuleDataTransmitter
		antennaType = INTERNAL
		packetInterval = 0.35
		packetSize = 2
		packetResourceCost = 18.0
		requiredResource = ElectricCharge
		DeployFxModules = 0
		antennaPower = 250000000000
		antennaCombinable = True
	}

	MODULE
	{
 	name = ModuleCommand
 	minimumCrew = 0
defaultControlPointDisplayName = #autoLOC_6011000 //#autoLOC_6011000 = Up
		CONTROLPOINT
		{
			name = forward
			displayName = #autoLOC_6011001 //#autoLOC_6011001 = Forward
			orientation = 90,0,0
		}
		CONTROLPOINT
		{
			name = reverse
			displayName = #autoLOC_6011004 //#autoLOC_6011004 = Reversed
			orientation = 180,0,0
		}
		RESOURCE
		{
		name = ElectricCharge
		rate = 0.0025
		}

	}
	MODULE
	{
		name = ModuleReactionWheel
		PitchTorque = 0.1
		YawTorque = 0.1
		RollTorque = 0.1
		RESOURCE
		{
			name = ElectricCharge
			rate = 0.05
		}
	}
	MODULE
	{
		name = ModuleSAS
		SASServiceLevel = 3
	}
	RESOURCE
	{
		name = ElectricCharge
		amount = 500
		maxAmount = 500
	}
	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = temperatureScan
		experimentActionName = #autoLOC_502067 //#autoLOC_502067 = Log Temperature
		resetActionName = #autoLOC_502064 //#autoLOC_502064 = Delete Data
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = False
		xmitDataScalar = 0.5
		dataIsCollectable = True
		collectActionName = #autoLOC_238018 //#autoLOC_238018 = Take Data
		interactionRange = 1.5
		rerunnable = True
		usageReqMaskInternal = 1
		usageReqMaskExternal = 8
	}
	MODULE
	{
		name = ModuleScienceExperiment
		experimentID = seismicScan
		experimentActionName = #autoLOC_502063 //#autoLOC_502063 = Log Seismic Data
		resetActionName = #autoLOC_502064 //#autoLOC_502064 = Delete Data
		useStaging = False
		useActionGroups = True
		hideUIwhenUnavailable = False
		xmitDataScalar = 0.45
		dataIsCollectable = True
		collectActionName = #autoLOC_238018 //#autoLOC_238018 = Take Data
		interactionRange = 1.5
		rerunnable = True
		usageReqMaskInternal = 1
		usageReqMaskExternal = 8
	}
	MODULE
	{
	name = ModuleScienceContainer
	
	reviewActionName = Review Data
	storeActionName = Store Experiments	
	collectActionName = Take Data
	
	evaOnlyStorage = False
	storageRange = 2
	
	allowRepeatedSubjects = True
	}

	MODULE
	{
		name = ModuleDeployableSolarPanel
		isTracking = false
		secondaryTransformName = suncatcher
		pivotName = suncatcher
		isBreakable = false
		resourceName = ElectricCharge
		chargeRate = 1.0
		extendActionName = #autoLOC_6001805 //#autoLOC_6001805 = Extend <<1>>
		retractActionName = #autoLOC_6001806 //#autoLOC_6001806 = Retract <<1>>
		extendpanelsActionName = #autoLOC_6001807 //#autoLOC_6001807 = Toggle <<1>>
	}
	MODULE
	{
		name = ModuleAnimateGeneric
		animationName = SolarPanel
		startEventGUIName = #CLEP_ExtendSolarPanel
		endEventGUIName = #CLEP_RetractSolarPanel
		actionGUIName = #CLEP_SolarPanel
	}
	MODULE
	{
		name = ModuleDecouple
		ejectionForce = 0.1
		isOmniDecoupler = false
		explosiveNodeID = bottom		
	}
}
