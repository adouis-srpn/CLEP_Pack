PART
{
	name = CLEP_YTE1XB
	module = Part
	author = SRP
	MODEL
	{
	model = ChinasLunarExplorationPack/Parts/CEE2/YTE1XB
	}
	rescaleFactor = 0.6
	node_stack_top = 0.0, 0.01863229, 0.0, 0.0, 1.0, 0.0, 1
	node_stack_1 = -0.327, -0.05, 0.7042, -1.0, 0.0, 0.0, 1
	node_stack_2 = -0.3491, -0.05, 0.0291, -1.0, 0.0, 0.0, 1
	node_stack_3 = -0.3491, -0.05, -0.6911, -1.0, 0.0, 0.0, 1
	node_stack_4 = 0.327, -0.05, 0.7042, 1.0, 0.0, 0.0, 1
	node_stack_5 = 0.3491, -0.05, 0.0291, 1.0, 0.0, 0.0, 1
	node_stack_6 = 0.3491, -0.05, -0.6911, 1.0, 0.0, 0.0, 1
	TechRequired = fieldScience
	entryCost = 700
	cost = 500
	category = Robotics
	subcategory = 0
	title  = #CLEP_YTE1XB_title
	manufacturer = #CLEP_CAST
	description  = #CLEP_YTE1XB_description
	attachRules = 1,0,1,1,0
	mass = 0.001
	dragModelType = default
	maximum_drag = 0.2
	minimum_drag = 0.3
	angularDrag = 2
	crashTolerance = 30
	breakingForce = 400
	breakingTorque = 400
	maxTemp = 2200
	bulkheadProfiles = size1, srf
	tags  = #CLEP_YTE1XB_tags

	MODULE
	{
		name = ModuleRoboticServoPiston		//核心液压伸缩模块（区别铰链核心）
		servoTransformName = TopJoint		//可伸缩活塞杆物体名
		baseTransformName = BottomJoint		//缸筒固定基座物体名（不动）
		servoAttachNodes = top		//活动活塞杆上的挂载节点为top顶部接口
		traverseVelocityLimits = 0.05, 1		//伸缩速度区间
		hardMinMaxLimits = 0,0.107		//硬件极限锁死区间，防止活塞杆穿模、物理崩坏
		softMinMaxExtension = 0,0.107		//软件伸缩行程，0完全收缩，1.6米完全伸出，到达边界自动减速缓冲
		mainAxis = Y		//物体本地Y轴，建模时活塞杆必须沿Y轴延伸，否则伸缩方向错乱
		servoMass = 0.0		//伸缩活塞杆额外附加运动质量，影响惯性、承重物理计算。
		maxMotorOutput = 10		//电机最大输出推力，数值越大可带动更重载荷（着陆器、采样臂适用）。
		positionSpringMutliplier = 1000		//位置回中弹簧强度，断电/无操作时自动缩回
		positionDampingMutliplier = 200		//伸缩阻尼，抑制活塞杆弹跳、克拉肯物理抖动。
		motorizedMassPerKN = 0.0004		//每千牛推力对应的电机附加自重，微调惯性表现。
		motorizedCostPerDriveUnit = 0.5		//电机制造成本系数，参与零件总造价计算。
		efficiency = 0.85		//电机能量转换效率75%，剩余电能转化为热量损耗。
		baseResourceConsumptionRate = 0.05		//基础耗电基数
		referenceConsumptionVelocity = 5		//耗电参考速度，伸缩速度越快耗电量线性上升。
		//运行消耗资源为电量ElectricCharge，rate是耗电倍率
		RESOURCE
		{
			name = ElectricCharge
			rate = 1
		}
		// INPUT_RESOURCE is by default equivalent to RESOURCE
		//INPUT_RESOURCE
		//{
		//	name = ElectricCharge
		//	rate = 1
		//}
		//OUTPUT_RESOURCE is required to reclaim energy from negative power
		//OUTPUT_RESOURCE
		//{
		//	name = ElectricCharge
		//	rate = 1
		//}
	}

	MODULE
	{
		//能源断电保护模块（与铰链逻辑完全一致）
		name = ModuleResourceAutoShiftState
		affectedResourceName = ElectricCharge
		affectedModuleName = ModuleRoboticServoPiston
		resourceShutOffHandler = true
		resourceStartUpHandler = true
		resourceShutOffStartUpUsePercent = true
		resourceShutOffAmount = 0
		resourceShutOffPercent = 0
		resourceStartUpAmount = 0
		resourceStartUpPercent = 5
	}
}
